name: Test, build and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: maps-directions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: maps-directions
          path: |
            dist/main.js
            dist/manifest.json
            dist/maps-directions-*.zip

  prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - name: Publish a new prerelease without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving it unchanged."
          else
            gh release create "$VERSION" \
              dist/main.js dist/manifest.json "dist/maps-directions-$VERSION.zip" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Maps Directions $VERSION" --notes-file RELEASE_NOTES.md
